<header class="page-heading">
  <p class="eyebrow">service-product-image-event works!</p>
  <h1>Products with images</h1>
  <p>Choose a product to view its details.</p>
</header>

<table border="1">
    <thead>
      <tr>
        <th>Product ID</th>
        <th>Product Name</th>
        <th>UnitPrice</th>
        <th>Picture</th>
        <th>#</th>
      </tr>
    </thead>
    <tbody>
      @for (p of products; track p.ProductId) {
        <tr>
          <td>{{ p.ProductId }}</td>
          <td>{{ p.ProductName }}</td>
          <td>{{ p.Price }}</td>
          <td><img [src]="p.Image" [alt]="p.ProductName" width="100" height="100"></td>
          <td>
            <button type="button" (click)="viewDetail(p)" [attr.aria-label]="'View details for ' + p.ProductName">
              Details
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
